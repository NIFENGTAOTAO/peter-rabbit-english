<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>👂 听音选图 - 彼得住</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { 
    font-family: 'Comic Sans MS', cursive, sans-serif; 
    background: linear-gradient(135deg, #E8F5E9, #FFF8E1); 
    min-height: 100vh; 
    display: flex; 
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 15px;
  }
  .container { max-width: 500px; width: 100%; }

  h1 { text-align: center; color: #33691E; font-size: 1.4em; margin-bottom: 10px; }

  .progress { 
    text-align: center; 
    color: #888; 
    font-size: 0.85em; 
    margin-bottom: 8px; 
  }
  .progress-bar { 
    height: 6px; 
    background: #ddd; 
    border-radius: 3px; 
    margin-bottom: 15px; 
    overflow: hidden; 
  }
  .progress-fill { 
    height: 100%; 
    background: linear-gradient(90deg, #81C784, #4CAF50); 
    border-radius: 3px; 
    transition: width 0.4s; 
  }

  /* 听音按钮 */
  .listen-btn { 
    display: block; 
    width: 100%; 
    background: #4CAF50; 
    color: white; 
    border: none; 
    padding: 20px; 
    border-radius: 20px; 
    font-size: 1.3em; 
    cursor: pointer; 
    margin-bottom: 15px;
    font-family: inherit;
  }
  .listen-btn:active { transform: scale(0.97); background: #388E3C; }
  .listen-btn.playing { background: #2E7D32; animation: pulse 0.8s infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.03)} }

  /* 提示文字 */
  .hint { text-align: center; color: #aaa; font-size: 0.85em; margin-bottom: 12px; }

  /* 四张图片选项 */
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
  .opt { 
    background: white; 
    border: 3px solid #ddd; 
    border-radius: 16px; 
    padding: 15px 10px; 
    text-align: center; 
    cursor: pointer; 
    transition: all 0.15s;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .opt:active { transform: scale(0.96); }
  .opt .emoji { font-size: 4em; line-height: 1; }
  .opt .label { font-size: 0.75em; color: #999; }

  .opt.correct { background: #C8E6C9; border-color: #4CAF50; }
  .opt.wrong { background: #FFCDD2; border-color: #F44336; }
  .opt.disabled { pointer-events: none; opacity: 0.6; }

  /* 结果 */
  .result { 
    text-align: center; 
    font-size: 1.1em; 
    padding: 15px; 
    border-radius: 16px; 
    margin-bottom: 10px;
  }
  .result.pass { background: #C8E6C9; color: #2E7D32; }
  .result.fail { background: #FFCDD2; color: #C62828; }

  .back { display: block; text-align: center; color: #4CAF50; text-decoration: none; font-size: 1em; margin-top: 5px; }

  .ep-tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
  .ep-tab { padding: 5px 14px; border: 2px solid #81C784; border-radius: 12px; background: white; color: #33691E; text-decoration: none; font-size: 0.8em; cursor: pointer; }
  .ep-tab.active { background: #4CAF50; color: white; border-color: #4CAF50; }
</style>
</head>
<body>
<div class="container">
  <h1>👂 听音选图</h1>

  <div class="ep-tabs">
    <span class="ep-tab active" id="tab-all" onclick="showAll()">全部</span>
    <span class="ep-tab" id="tab-s1e1" onclick="showS1E1()">🐰 S1E1</span>
    <span class="ep-tab" id="tab-s1e2" onclick="showS1E2()">🌿 S1E2</span>
  </div>

  <div class="progress"><span id="progressText">第 1 题 / 共 39 题</span></div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:2.6%"></div></div>

  <button class="listen-btn" id="listenBtn" onclick="playWord()">
    🔊 点击听发音
  </button>

  <div class="hint">👆 仔细听，然后选出对应的图片</div>

  <div class="options" id="options"></div>
  <div class="result" id="result" style="display:none"></div>

  <a href="index.html" class="back">🏠 返回首页</a>
</div>

<script>
// ==================== 听音选图数据 ====================
// 每个单词: en英文, cn中文, emoji图片, distractors干扰项(emoji列表)
const quizData = [
  // S1E1
  { ep:"s1e1", en:"Rabbit",    cn:"兔子",   emoji:"🐰", distractors:["🐻","🦊","🐸","🐷"] },
  { ep:"s1e1", en:"bunny",     cn:"小兔子",  emoji:"🐰", distractors:["🐭","🐹","🦔","🐿"] },
  { ep:"s1e1", en:"Mopsy",     cn:"莫普西",  emoji:"🐰", distractors:["🐱","🐶","🐻","🐷"] },
  { ep:"s1e1", en:"Flopsy",    cn:"弗洛西",  emoji:"🐰", distractors:["🐰","🐻","🦊","🐸"] },
  { ep:"s1e1", en:"tree",      cn:"树",      emoji:"🌳", distractors:["🌲","🌴","🌵","🌷"] },
  { ep:"s1e1", en:"hole",      cn:"地洞",    emoji:"🕳️", distractors:["🏠","🌳","🪨","⛺"] },
  { ep:"s1e1", en:"bread",     cn:"面包",    emoji:"🍞", distractors:["🥐","🍰","🧁","🥖"] },
  { ep:"s1e1", en:"town",      cn:"镇上",    emoji:"🏘️", distractors:["🏠","🏪","🏥","🏫"] },
  { ep:"s1e1", en:"outside",   cn:"外面",    emoji:"🚪", distractors:["🪟","🏠","🌳","🚗"] },
  { ep:"s1e1", en:"basket",    cn:"篮子",    emoji:"🧺", distractors:["🎒","👜","👝","🛒"] },
  { ep:"s1e1", en:"umbrella",  cn:"雨伞",    emoji:"☂️", distractors:["🎩","🧢","👒","🎽"] },
  { ep:"s1e1", en:"berry",      cn:"浆果",    emoji:"🫐", distractors:["🍓","🍇","🍎","🍊"] },
  { ep:"s1e1", en:"bush",      cn:"灌木丛",  emoji:"🌿", distractors:["🌳","🌵","🌷","🌻"] },
  { ep:"s1e1", en:"path",      cn:"小路",    emoji:"🛤️", distractors:["🛣️","🌊","🏔️","🌲"] },
  { ep:"s1e1", en:"jacket",    cn:"外套",    emoji:"🧥", distractors:["👕","👗","👖","🩱"] },
  { ep:"s1e1", en:"shoes",     cn:"鞋子",    emoji:"👟", distractors:["🧦","🎩","🧤","👒"] },
  { ep:"s1e1", en:"mother",    cn:"妈妈",    emoji:"👩", distractors:["👨","👴","👵","👶"] },
  { ep:"s1e1", en:"garden",    cn:"花园",    emoji:"🌻", distractors:["🌲","🌵","🏠","🪨"] },
  // S1E2
  { ep:"s1e2", en:"farmer",    cn:"农夫",    emoji:"👨‍🌾", distractors:["👨‍🍳","👨‍🏫","👨‍🔧","👨‍✈️"] },
  { ep:"s1e2", en:"gate",      cn:"大门",    emoji:"🚧", distractors:["🚪","🪟","🏠","🌳"] },
  { ep:"s1e2", en:"woods",     cn:"树林",    emoji:"🌲", distractors:["🌳","🌵","🏔️","🌊"] },
  { ep:"s1e2", en:"net",       cn:"网",      emoji:"🕸️", distractors:["🧵","🪢","🔗","⛓️"] },
  { ep:"s1e2", en:"vegetable",  cn:"蔬菜",    emoji:"🥬", distractors:["🍎","🍞","🧀","🥚"] },
  { ep:"s1e2", en:"lettuce",   cn:"生菜",    emoji:"🥬", distractors:["🥒","🌽","🍅","🥕"] },
  { ep:"s1e2", en:"beans",      cn:"豆子",    emoji:"🫘", distractors:["🥜","🌰","🍄","🥔"] },
  { ep:"s1e2", en:"radish",    cn:"小萝卜",  emoji:"🔴", distractors:["🟠","🟡","🟢","🟣"] },
  { ep:"s1e2", en:"potato",    cn:"土豆",    emoji:"🥔", distractors:["🍠","🌽","🥕","🍆"] },
  { ep:"s1e2", en:"cabbage",   cn:"卷心菜",  emoji:"🥬", distractors:["🥒","🍅","🌽","🥕"] },
  { ep:"s1e2", en:"rake",      cn:"耙子",    emoji:"🔨", distractors:["🪓","⛏️","🪚","🔧"] },
  { ep:"s1e2", en:"thief",     cn:"贼",      emoji:"🦹", distractors:["🧙","🤴","🤵","👸"] },
  { ep:"s1e2", en:"leaf",      cn:"树叶",    emoji:"🍃", distractors:["🌸","🌺","🌻","🌹"] },
  { ep:"s1e2", en:"button",    cn:"纽扣",    emoji:"🔘", distractors:["🔔","💡","🔑","📌"] },
  { ep:"s1e2", en:"corner",    cn:"角落",    emoji:"📐", distractors:["📏","✂️","📎","🖊️"] },
  { ep:"s1e2", en:"heart",     cn:"心脏",    emoji:"❤️", distractors:["⭐","💜","🧡","💙"] },
  { ep:"s1e2", en:"home",      cn:"家",      emoji:"🏠", distractors:["🏪","🏥","🏫","🏢"] },
];

// Fisher-Yates shuffle
function shuffle(arr, seed) {
  const a = [...arr];
  let m = a.length;
  while (m) {
    const s = (seed * 9301 + 49297) % 233280;
    const t = Math.floor((s / 233280) * m--);
    [a[m], a[t]] = [a[t], a[m]];
    seed = (seed * 9301 + 49297) % 233280;
  }
  return a;
}

function seededShuffle(arr, seed) {
  const result = [...arr];
  let m = result.length;
  while (m) {
    const s = (seed * 9301 + 49297) % 233280;
    const t = Math.floor((s / 233280) * m--);
    [result[m], result[t]] = [result[t], result[m]];
    seed = (seed * 9301 + 49297) % 233280;
  }
  return result;
}

let fullQuiz = [];
let currentIdx = 0;
let correctCount = 0;
let utter = null;
let currentFilter = 'all';
let filteredData = quizData;

function buildQuiz() {
  // 为每个单词构建一道题：正确答案emoji + 3个干扰项，打乱
  const seed = 20260711;
  fullQuiz = filteredData.map((item, i) => {
    const wrongOptions = seededShuffle(item.distractors, seed + i).slice(0, 3);
    const options = shuffle([{emoji: item.emoji, label: item.cn, correct: true}, ...wrongOptions.map(e => ({emoji: e, label: '', correct: false}))], seed + i * 7);
    return { ...item, options };
  });
}

function speak(text) {
  try {
    if (utter) window.speechSynthesis.cancel();
    utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    utter.rate = 0.65;
    window.speechSynthesis.speak(utter);
  } catch(e) {}
}

function playWord() {
  const q = fullQuiz[currentIdx];
  const btn = document.getElementById('listenBtn');
  btn.classList.add('playing');
  btn.textContent = '🔊 播放中...';
  speak(q.en);
  utter.onend = () => {
    btn.classList.remove('playing');
    btn.textContent = '🔊 点击听发音';
  };
  utter.onerror = () => {
    btn.classList.remove('playing');
    btn.textContent = '🔊 点击听发音';
  };
}

function renderQuestion() {
  const q = fullQuiz[currentIdx];
  document.getElementById('progressText').textContent = `第 ${currentIdx + 1} 题 / 共 ${fullQuiz.length} 题`;
  document.getElementById('progressFill').style.width = `${((currentIdx + 1) / fullQuiz.length) * 100}%`;
  document.getElementById('result').style.display = 'none';
  document.getElementById('options').innerHTML = '';

  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'opt';
    div.id = 'opt-' + i;
    div.innerHTML = `<div class="emoji">${opt.emoji}</div>${opt.label ? `<div class="label">${opt.label}</div>` : ''}`;
    div.onclick = () => checkAnswer(i, opt.correct);
    document.getElementById('options').appendChild(div);
  });

  const btn = document.getElementById('listenBtn');
  btn.classList.remove('playing');
  btn.textContent = '🔊 点击听发音';

  // 自动播放
  setTimeout(playWord, 400);
}

function checkAnswer(selectedIdx, correct) {
  const q = fullQuiz[currentIdx];
  const correctIdx = q.options.findIndex(o => o.correct);

  document.querySelectorAll('.opt').forEach(o => o.classList.add('disabled'));

  if (correct) {
    document.getElementById('opt-' + selectedIdx).classList.add('correct');
    correctCount++;
    speak('Correct! ' + q.en);
  } else {
    document.getElementById('opt-' + selectedIdx).classList.add('wrong');
    document.getElementById('opt-' + correctIdx).classList.add('correct');
    speak('Wrong. ' + q.en);
  }

  setTimeout(() => {
    currentIdx++;
    if (currentIdx < fullQuiz.length) {
      renderQuestion();
    } else {
      showResult();
    }
  }, 2000);
}

function showResult() {
  const pct = Math.round((correctCount / fullQuiz.length) * 100);
  document.getElementById('progressText').textContent = '完成！';
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('options').innerHTML = '';
  document.getElementById('listenBtn').style.display = 'none';
  const div = document.getElementById('result');
  div.style.display = 'block';
  if (pct >= 80) {
    div.className = 'result pass';
    div.textContent = `🎉 太棒了！${correctCount}/${fullQuiz.length} 题正确！`;
  } else if (pct >= 60) {
    div.className = 'result pass';
    div.textContent = `👍 不错！${correctCount}/${fullQuiz.length} 题正确！`;
  } else {
    div.className = 'result fail';
    div.textContent = `💪 继续加油！${correctCount}/${fullQuiz.length} 题正确，再听几遍吧！`;
  }
}

function showFilter(f) {
  document.querySelectorAll('.ep-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + f).classList.add('active');
  currentFilter = f;
  filteredData = f === 'all' ? quizData : quizData.filter(q => q.ep === f);
  currentIdx = 0;
  correctCount = 0;
  document.getElementById('listenBtn').style.display = 'block';
  buildQuiz();
  renderQuestion();
}

function showAll() { showFilter('all'); }
function showS1E1() { showFilter('s1e1'); }
function showS1E2() { showFilter('s1e2'); }

buildQuiz();
renderQuestion();
</script>
</body>
</html>
